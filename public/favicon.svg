<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#182236"/>
      <stop offset="60%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#05070C"/>
    </radialGradient>

    <!-- Golden Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0"/>
      <stop offset="35%" stop-color="#F6C54E"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Flame Gradient -->
    <radialGradient id="flameInner" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FEF08A"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </radialGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Gold Edge -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#goldLight)" stroke-width="6"/>
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="rgba(246, 197, 78, 0.2)" stroke-width="2"/>

  <!-- Celestial Rays / Mandala Rings -->
  <g transform="translate(256, 256)" opacity="0.35">
    <circle r="195" fill="none" stroke="url(#goldLight)" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle r="180" fill="none" stroke="url(#goldLight)" stroke-width="2"/>
    <circle r="165" fill="none" stroke="url(#goldLight)" stroke-width="1" stroke-dasharray="2 6"/>
  </g>

  <!-- Sacred Lotus + Flame Group -->
  <g transform="translate(256, 256)">
    <!-- Outer Halo Glow -->
    <circle r="90" fill="#F59E0B" opacity="0.25" filter="url(#goldGlow)"/>

    <!-- Lotus Outer/Back Petals -->
    <!-- Left Wing Outer -->
    <path d="M 0,55 C -70,55 -155,-5 -155,-75 C -155,-125 -105,-155 -60,-115 C -25,-85 -5,10 0,55 Z" 
          fill="url(#goldDark)" opacity="0.75" />
    <!-- Right Wing Outer -->
    <path d="M 0,55 C 70,55 155,-5 155,-75 C 155,-125 105,-155 60,-115 C 25,-85 5,10 0,55 Z" 
          fill="url(#goldDark)" opacity="0.75" />

    <!-- Lotus Mid Petals -->
    <!-- Left Mid -->
    <path d="M 0,65 C -65,65 -130,20 -130,-45 C -130,-95 -85,-125 -50,-85 C -20,-50 0,15 0,65 Z" 
          fill="url(#goldLight)" stroke="#FFFBEB" stroke-width="2"/>
    <!-- Right Mid -->
    <path d="M 0,65 C 65,65 130,20 130,-45 C 130,-95 85,-125 50,-85 C 20,-50 0,15 0,65 Z" 
          fill="url(#goldLight)" stroke="#FFFBEB" stroke-width="2"/>

    <!-- Lotus Base Petal / Calyx -->
    <path d="M -90,65 C -50,135 50,135 90,65 C 50,95 -50,95 -90,65 Z" 
          fill="url(#goldDark)" stroke="url(#goldBright)" stroke-width="2"/>
    <!-- Bottom Drop Petal -->
    <path d="M 0,70 C -35,95 -30,140 0,165 C 30,140 35,95 0,70 Z" 
          fill="url(#goldBright)" stroke="#FFFBEB" stroke-width="2"/>

    <!-- Lotus Inner Front Petals -->
    <!-- Left Inner -->
    <path d="M 0,65 C -45,60 -95,20 -95,-35 C -95,-80 -55,-100 -30,-60 C -10,-25 0,25 0,65 Z" 
          fill="url(#goldBright)" stroke="#FFFBEB" stroke-width="2.5"/>
    <!-- Right Inner -->
    <path d="M 0,65 C 45,60 95,20 95,-35 C 95,-80 55,-100 30,-60 C 10,-25 0,25 0,65 Z" 
          fill="url(#goldBright)" stroke="#FFFBEB" stroke-width="2.5"/>

    <!-- Center Main Royal Petal Framing the Flame -->
    <path d="M 0,70 C -60,40 -65,-75 0,-155 C 65,-75 60,40 0,70 Z" 
          fill="url(#goldLight)" stroke="#FFFBEB" stroke-width="3" filter="url(#goldGlow)"/>

    <!-- Inner Cavity Shadow behind flame -->
    <path d="M 0,60 C -42,35 -45,-55 0,-125 C 45,-55 42,35 0,60 Z" 
          fill="#1C1304" opacity="0.9"/>

    <!-- Sacred Eternal Flame (Brahma-Jyoti) -->
    <!-- Outer Flame -->
    <path d="M 0,55 C -35,35 -38,-35 -5,-85 C -2,-45 8,-35 15,-20 C 25,-45 25,-75 10,-105 C 35,-65 35,35 0,55 Z" 
          fill="url(#flameInner)" filter="url(#flameGlow)"/>

    <!-- Inner Core Radiant Flame -->
    <path d="M 0,50 C -20,35 -20,-15 0,-60 C 20,-15 20,35 0,50 Z" 
          fill="#FFFFFF" opacity="0.95"/>

    <!-- Radiant Sparkle / Star of Knowledge -->
    <polygon points="0,-175 4,-162 17,-162 7,-153 10,-140 0,-148 -10,-140 -7,-153 -17,-162 -4,-162" 
             fill="#FFFBEB" stroke="url(#goldBright)" stroke-width="1.5"/>
  </g>
</svg>
